<!-- HashLocationStrategy 配下ではフラグメント遷移がルーティングを壊すため、フォーカス移動で代替する -->
<button
  type="button"
  class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded focus:bg-indigo-700 focus:px-3 focus:py-2 focus:text-sm focus:text-white"
  (click)="skipToMain()"
>
  本文へスキップ
</button>

<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
    <a routerLink="/" class="text-lg font-bold tracking-tight text-slate-900">Tallia</a>
    <nav aria-label="メインナビゲーション" class="flex items-center gap-1 text-sm">
      <a
        routerLink="/"
        routerLinkActive="bg-slate-200 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-md px-3 py-1.5 text-slate-700 hover:bg-slate-100"
      >
        プロジェクト
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="bg-slate-200 font-semibold"
        class="rounded-md px-3 py-1.5 text-slate-700 hover:bg-slate-100"
      >
        設定
      </a>
    </nav>
  </div>
</header>

@if (!storage.indexedDbAvailable) {
  <div role="alert" class="border-b border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
    <div class="mx-auto flex max-w-5xl items-center gap-1">
      <span>このブラウザではデータを保存できません。</span>
      <app-info-hint
        label="保存できない理由の説明"
        text="このブラウザで IndexedDB が使えない状態です。プライベートブラウジングを解除するか、別のブラウザで開き直してください。"
      />
    </div>
  </div>
}

@if (appUpdate.updateReady()) {
  <div
    role="status"
    class="border-b border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-900"
  >
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-1">
        <span>新しいバージョンがあります。</span>
        <app-info-hint
          label="再読み込みの注意の説明"
          text="再読み込みすると入力中の内容は失われます。編集途中のものがあれば、保存してから実行してください。"
        />
      </div>
      <button type="button" class="btn btn-primary" (click)="reload()">再読み込み</button>
    </div>
  </div>
}

<main #main id="main" tabindex="-1" class="mx-auto max-w-5xl px-4 py-6 focus:outline-none">
  <router-outlet />
</main>
