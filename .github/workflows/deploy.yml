name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、最新のコミットだけを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # プロジェクトサイトはサブパス配信のため base-href を合わせる
      - name: Build
        run: npm run build:pages

      # SPA の直リンク（/tallia/settings など）を index.html に流す
      - name: Add SPA fallback
        run: cp dist/tallia/browser/index.html dist/tallia/browser/404.html

      # `_` 始まりのファイルが無視されないようにする
      - name: Disable Jekyll
        run: touch dist/tallia/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tallia/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
